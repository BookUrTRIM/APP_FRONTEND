<div class="min-h-screen flex flex-col bg-cream font-sans text-espresso pb-16 md:pb-0">

  <!-- Header -->
  <header class="bg-espresso sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">

        <a routerLink="/client" class="flex-shrink-0 flex items-center cursor-pointer">
          <span class="font-display text-2xl font-semibold text-cream tracking-wide italic">
            BookUr<span class="text-gold">TRIM</span>
          </span>
        </a>

        <nav class="hidden md:flex space-x-1">
          <a routerLink="/client/providers" routerLinkActive="text-gold bg-gold/10"
            class="text-cream/60 hover:text-cream hover:bg-cream/10 px-4 py-2 rounded-full text-sm font-medium transition-colors">
            Rechercher
          </a>
          <a routerLink="/client/appointments" routerLinkActive="text-gold bg-gold/10"
            class="text-cream/60 hover:text-cream hover:bg-cream/10 px-4 py-2 rounded-full text-sm font-medium transition-colors">
            Mes rendez-vous
          </a>
        </nav>

        <div class="flex items-center gap-3">
          <a routerLink="/client/profile" routerLinkActive="text-gold bg-gold/10"
            class="hidden md:inline-flex items-center gap-1.5 text-cream/60 hover:text-cream hover:bg-cream/10 px-4 py-2 rounded-full text-sm font-medium transition-colors">
            Mon profil
          </a>
          <!-- Déconnexion desktop -->
          <button type="button" (click)="logout()"
            class="hidden md:inline-flex items-center gap-1.5 text-cream/40 hover:text-cream/80 px-3 py-2 rounded-full text-sm font-medium transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            Déconnexion
          </button>
          <!-- Déconnexion mobile -->
          <button type="button" (click)="logout()"
            class="md:hidden p-2 text-cream/40 hover:text-cream/80 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
          </button>
        </div>

      </div>
    </div>
  </header>

  <main class="flex-grow w-full">
    <router-outlet></router-outlet>
  </main>

  <footer class="hidden md:block bg-espresso mt-auto">
    <div class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
      <p class="text-center font-display italic text-cream/40 text-sm">
        &copy; 2026 BookUrTrim. Tous droits réservés.
      </p>
    </div>
  </footer>

  <!-- Barre de navigation mobile fixe en bas -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-espresso border-t border-cream/10 z-50">
    <div class="flex justify-around items-center h-16 px-2">

      <a routerLink="/client/providers" routerLinkActive="text-gold"
        class="flex flex-col items-center gap-1 text-cream/50 hover:text-cream transition-colors px-3 py-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <span class="text-xs font-medium">Rechercher</span>
      </a>

      <a routerLink="/client/appointments" routerLinkActive="text-gold"
        class="flex flex-col items-center gap-1 text-cream/50 hover:text-cream transition-colors px-3 py-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
        <span class="text-xs font-medium">Rendez-vous</span>
      </a>

      <a routerLink="/client/profile" routerLinkActive="text-gold"
        class="flex flex-col items-center gap-1 text-cream/50 hover:text-cream transition-colors px-3 py-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
        <span class="text-xs font-medium">Profil</span>
      </a>

    </div>
  </nav>

<app-confirm-modal />
</div>
