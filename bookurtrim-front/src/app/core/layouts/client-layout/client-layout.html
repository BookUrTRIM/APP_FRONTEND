<div class="min-h-screen flex flex-col bg-gray-50 font-sans text-gray-900">

  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">

        <a routerLink="/client" class="flex-shrink-0 flex items-center cursor-pointer">
          <span class="text-2xl font-black text-indigo-600 tracking-tighter">BookUrTRIM</span>
        </a>

        <nav class="hidden md:flex space-x-2">
          <a
            routerLink="/client/providers"
            routerLinkActive="text-indigo-600 bg-indigo-50"
            class="text-gray-500 hover:text-indigo-600 hover:bg-indigo-50 px-4 py-2 rounded-lg text-sm font-medium transition-colors"
          >
            Rechercher
          </a>
          <a
            routerLink="/client/appointments"
            routerLinkActive="text-indigo-600 bg-indigo-50"
            class="text-gray-500 hover:text-indigo-600 hover:bg-indigo-50 px-4 py-2 rounded-lg text-sm font-medium transition-colors"
          >
            Mes rendez-vous
          </a>
        </nav>

        <div class="flex items-center gap-3">
          <a
            routerLink="/client/profile"
            routerLinkActive="text-indigo-600 bg-indigo-50"
            class="hidden md:inline-flex items-center gap-1.5 text-gray-500 hover:text-indigo-600 hover:bg-indigo-50 px-4 py-2 rounded-full text-sm font-semibold transition-colors"
          >
            Mon profil
          </a>
          <button
            type="button"
            (click)="logout()"
            class="hidden md:inline-flex items-center gap-1.5 text-gray-500 hover:text-red-500 px-3 py-2 rounded-lg text-sm font-medium transition-colors"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            Déconnexion
          </button>
          <button class="md:hidden text-gray-400 hover:text-gray-500 focus:outline-none">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>
        </div>

      </div>
    </div>
  </header>

  <main class="flex-grow w-full">
    <router-outlet></router-outlet>
  </main>

  <footer class="bg-white border-t border-gray-200 mt-auto">
    <div class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
      <p class="text-center text-sm text-gray-400">
        &copy; 2026 BookUrTrim. Tous droits réservés.
      </p>
    </div>
  </footer>

</div>
