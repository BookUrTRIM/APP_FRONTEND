<div class="flex h-screen bg-cream font-sans text-espresso overflow-hidden pb-16 md:pb-0">

  <aside class="hidden w-64 bg-espresso text-cream/70 md:flex md:flex-col shadow-lg z-20">
    <div class="flex items-center justify-center h-20 border-b border-cream/10">
      <span class="font-display text-2xl font-semibold text-cream tracking-wide italic">BookUrTRIM Pro</span>
    </div>

    <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto">
      <a routerLink="/pro/dashboard" routerLinkActive="bg-gold/20 text-gold border-l-2 border-gold" class="flex items-center gap-3 px-4 py-3 hover:bg-cream/10 hover:text-cream rounded-xl transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        <span class="text-sm font-medium">Dashboard</span>
      </a>

      <a routerLink="/pro/planning" routerLinkActive="bg-gold/20 text-gold border-l-2 border-gold" class="flex items-center gap-3 px-4 py-3 hover:bg-cream/10 hover:text-cream rounded-xl transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        <span class="text-sm font-medium">Planning & dispos</span>
      </a>

      <a routerLink="/pro/appointments" routerLinkActive="bg-gold/20 text-gold border-l-2 border-gold" class="flex items-center gap-3 px-4 py-3 hover:bg-cream/10 hover:text-cream rounded-xl transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        <span class="text-sm font-medium">Mes rendez-vous</span>
      </a>

      <a routerLink="/pro/services" routerLinkActive="bg-gold/20 text-gold border-l-2 border-gold" class="flex items-center gap-3 px-4 py-3 hover:bg-cream/10 hover:text-cream rounded-xl transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
        <span class="text-sm font-medium">Catalogue de services</span>
      </a>

      <a routerLink="/pro/profile" routerLinkActive="bg-gold/20 text-gold border-l-2 border-gold" class="flex items-center gap-3 px-4 py-3 hover:bg-cream/10 hover:text-cream rounded-xl transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="text-sm font-medium">Mon profil</span>
      </a>

      <a routerLink="/pro/stripe-connect" routerLinkActive="bg-gold/20 text-gold border-l-2 border-gold" class="flex items-center gap-3 px-4 py-3 hover:bg-cream/10 hover:text-cream rounded-xl transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span class="text-sm font-medium">Paiements</span>
        @if (provider() && !provider()!.stripe_account_id) {
          <span class="ml-auto h-2 w-2 rounded-full bg-bordeaux"></span>
        }
      </a>
    </nav>

    <div class="p-4 border-t border-cream/10">
      <button type="button" (click)="logout()" class="w-full flex items-center justify-center gap-2 px-4 py-2 hover:bg-cream/10 text-cream/50 hover:text-cream rounded-xl transition-colors text-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        Déconnexion
      </button>
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

    <header class="flex items-center justify-between px-6 py-4 bg-cream border-b border-beige z-10">
      <div class="flex items-center gap-4">
        <span class="font-display text-sm italic text-taupe md:hidden">BookUr<span class="text-gold">TRIM</span> Pro</span>
        <h1 class="font-display text-xl font-semibold text-espresso italic">Vue d'ensemble</h1>
      </div>

      <div class="flex items-center gap-3">
        <!-- Déconnexion mobile -->
        <button type="button" (click)="logout()"
          class="md:hidden p-2 text-taupe hover:text-espresso transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
        </button>

        <!-- Notification + avatar desktop -->
        <button class="relative hidden md:block text-taupe hover:text-chocolate transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
        </button>

        <div class="flex items-center gap-3 cursor-pointer">
          <div class="h-9 w-9 rounded-full bg-chocolate flex items-center justify-center text-cream text-sm font-semibold">
            {{ initials }}
          </div>
          <div class="hidden sm:block text-sm">
            <p class="font-semibold text-espresso">{{ fullName }}</p>
            <p class="text-taupe text-xs">Prestataire</p>
          </div>
        </div>
      </div>
    </header>


    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-cream p-6">
      <div class="max-w-7xl mx-auto">
        <router-outlet></router-outlet>
      </div>
    </main>

    <!-- Barre de navigation mobile (visible uniquement sur mobile) -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-espresso border-t border-cream/10 z-50">
      <div class="flex justify-around items-center h-16 px-1">

        <a routerLink="/pro/appointments" routerLinkActive="text-gold"
          class="flex flex-col items-center gap-0.5 text-cream/50 hover:text-cream transition-colors px-2 py-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
          <span class="text-xs font-medium">RDV</span>
        </a>

        <a routerLink="/pro/planning" routerLinkActive="text-gold"
          class="flex flex-col items-center gap-0.5 text-cream/50 hover:text-cream transition-colors px-2 py-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
          </svg>
          <span class="text-xs font-medium">Planning</span>
        </a>

        <a routerLink="/pro/services" routerLinkActive="text-gold"
          class="flex flex-col items-center gap-0.5 text-cream/50 hover:text-cream transition-colors px-2 py-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
          </svg>
          <span class="text-xs font-medium">Services</span>
        </a>

        <a routerLink="/pro/profile" routerLinkActive="text-gold"
          class="flex flex-col items-center gap-0.5 text-cream/50 hover:text-cream transition-colors px-2 py-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          <span class="text-xs font-medium">Profil</span>
        </a>

        <a routerLink="/pro/stripe-connect" routerLinkActive="text-gold"
          class="flex flex-col items-center gap-0.5 text-cream/50 hover:text-cream transition-colors px-2 py-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span class="text-xs font-medium">Paiements</span>
        </a>

      </div>
    </nav>

  </div>
<app-confirm-modal />
</div>
