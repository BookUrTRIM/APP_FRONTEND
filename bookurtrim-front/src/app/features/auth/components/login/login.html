<div class="min-h-screen flex items-center justify-center bg-slate-50 py-12 px-4 sm:px-6 lg:px-8 font-sans">
  <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl">
    <div>
      <h2 class="mt-2 text-center text-3xl font-extrabold text-slate-900 tracking-tight">
        Bon retour parmi nous
      </h2>
      <p class="mt-2 text-center text-sm text-slate-600">
        Ou
        <a routerLink="/auth/signup" class="font-medium text-indigo-600 hover:text-indigo-500 transition-colors">
          créez votre compte gratuitement
        </a>
      </p>
    </div>

    <form class="mt-8 space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div *ngIf="errorMessage" class="bg-red-50 text-red-700 p-3 rounded-lg text-sm text-center font-medium">
        {{ errorMessage }}
      </div>

      <div class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Adresse email</label>
          <input id="email" type="email" formControlName="email" class="appearance-none relative block w-full px-3 py-2 border border-slate-300 rounded-lg placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-all" placeholder="jean@exemple.com">
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Mot de passe</label>
          <input id="password" type="password" formControlName="password" class="appearance-none relative block w-full px-3 py-2 border border-slate-300 rounded-lg placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-all" placeholder="••••••••">
        </div>
      </div>

      <div>
        <button type="submit" [disabled]="loginForm.invalid || isLoading"
                class="group relative w-full flex justify-center py-2.5 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
          <span *ngIf="!isLoading">Se connecter</span>
          <span *ngIf="isLoading">Connexion en cours...</span>
        </button>
      </div>

    </form>
  </div>
</div>
