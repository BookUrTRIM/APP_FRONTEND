<div class="min-h-screen flex items-center justify-center bg-slate-50 py-12 px-4 sm:px-6 lg:px-8 font-sans">
  <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl">
    <div>
      <h2 class="mt-2 text-center text-3xl font-extrabold text-slate-900 tracking-tight">
        Créer un compte
      </h2>
      <p class="mt-2 text-center text-sm text-slate-600">
        Ou
        <a routerLink="/auth/login" class="font-medium text-indigo-600 hover:text-indigo-500 transition-colors">
          connectez-vous à un compte existant
        </a>
      </p>
    </div>

    <form class="mt-8 space-y-6" [formGroup]="signupForm" (ngSubmit)="onSubmit()">

      <div *ngIf="errorMessage" class="bg-red-50 text-red-700 p-3 rounded-lg text-sm text-center font-medium">
        {{ errorMessage }}
      </div>
      <div *ngIf="successMessage" class="bg-green-50 text-green-700 p-3 rounded-lg text-sm text-center font-medium">
        {{ successMessage }}
      </div>

      <div class="space-y-5">

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Je suis un...</label>
          <div class="grid grid-cols-2 gap-4">
            <div (click)="selectRole('client')"
                 [ngClass]="{'border-indigo-600 bg-indigo-50 ring-1 ring-indigo-600': currentRole === 'client', 'border-slate-200 bg-white hover:bg-slate-50': currentRole !== 'client'}"
                 class="cursor-pointer border rounded-xl p-4 text-center transition-all">
              <svg class="mx-auto h-8 w-8 mb-2" [ngClass]="{'text-indigo-600': currentRole === 'client', 'text-slate-400': currentRole !== 'client'}" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
              <span class="block text-sm font-semibold text-slate-900">Client</span>
            </div>

            <div (click)="selectRole('provider')"
                 [ngClass]="{'border-indigo-600 bg-indigo-50 ring-1 ring-indigo-600': currentRole === 'provider', 'border-slate-200 bg-white hover:bg-slate-50': currentRole !== 'provider'}"
                 class="cursor-pointer border rounded-xl p-4 text-center transition-all">
              <svg class="mx-auto h-8 w-8 mb-2" [ngClass]="{'text-indigo-600': currentRole === 'provider', 'text-slate-400': currentRole !== 'provider'}" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
              <span class="block text-sm font-semibold text-slate-900">Prestataire</span>
            </div>
          </div>
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Adresse email</label>
          <input id="email" type="email" formControlName="email" class="appearance-none relative block w-full px-3 py-2 border border-slate-300 rounded-lg placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-all" placeholder="jean@exemple.com">
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Mot de passe</label>
          <input id="password" type="password" formControlName="password" class="appearance-none relative block w-full px-3 py-2 border border-slate-300 rounded-lg placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-all" placeholder="Minimum 8 caractères">
        </div>
      </div>

      <div>
        <button type="submit" [disabled]="signupForm.invalid || isLoading"
                class="group relative w-full flex justify-center py-2.5 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
          <span *ngIf="!isLoading">Créer mon compte</span>
          <span *ngIf="isLoading">Création en cours...</span>
        </button>
      </div>
    </form>
  </div>
</div>
