<div class="p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between hover:shadow transition-all duration-200 relative overflow-hidden h-full"
     [ngClass]="{
       'bg-cream text-slate-800': variant() !== 'indigo',
       'bg-indigo-600 text-white': variant() === 'indigo'
     }">

  @if (variant() === 'indigo') {
    <div class="absolute top-0 right-0 -mr-4 -mt-4 opacity-10">
      <svg class="w-24 h-24" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"></path></svg>
    </div>
  }

  <div class="flex items-center justify-between gap-2">
    <p class="text-xs font-bold uppercase tracking-wider"
       [ngClass]="variant() === 'indigo' ? 'text-indigo-200' : 'text-slate-400'">
      {{ title() }}
    </p>
    @if (icon()) {
      <div class="w-9 h-9 rounded-full flex items-center justify-center text-base"
           [ngClass]="{
             'bg-blue-50 text-blue-500': icon() === '📅',
             'bg-emerald-50 text-emerald-500': icon() === '✂️',
             'bg-rose-50 text-rose-500': icon() === '📉'
           }">
        {{ icon() }}
      </div>
    }
  </div>

  <div class="mt-3">
    <p class="text-2xl lg:text-3xl font-black tracking-tight leading-none"
       [ngClass]="{
         'text-emerald-500': variant() === 'emerald',
         'text-slate-900': variant() === 'slate',
         'text-white': variant() === 'indigo'
       }">
      {{ value() }}
    </p>
    <p class="text-[11px] mt-1.5 font-medium"
       [ngClass]="variant() === 'indigo' ? 'text-indigo-300' : 'text-slate-400'">
      {{ subtext() }}
    </p>
  </div>
</div>
