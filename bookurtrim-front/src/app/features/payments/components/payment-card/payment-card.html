<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 space-y-3">

  <div class="flex items-center justify-between gap-3">
    <div>
      <p class="font-semibold text-gray-900">{{ typeLabel[payment().paymentType] }}</p>
      <p class="text-2xl font-bold text-indigo-600 mt-0.5">{{ formatAmount(payment().amount) }}</p>
    </div>
    <span class="shrink-0 px-2.5 py-1 rounded-full text-xs font-semibold"
      [class]="statusClass[payment().status]">
      {{ statusLabel[payment().status] }}
    </span>
  </div>

  @if (payment().paidAt) {
    <p class="text-sm text-gray-500">
      Payé le {{ formatDate(payment().paidAt!) }}
    </p>
  }

  @if (payment().stripeReceiptUrl && payment().status === PaymentStatus.VALIDATED) {
    <a [href]="payment().stripeReceiptUrl!" target="_blank"
      class="inline-flex items-center gap-1.5 text-xs text-indigo-600 hover:text-indigo-800 font-medium transition-colors">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
      </svg>
      Voir le reçu Stripe
    </a>
  }

</div>
