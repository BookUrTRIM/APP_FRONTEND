<div class="bg-cream p-6 rounded-xl shadow-sm border border-slate-200">
  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Date de début</label>
      <input type="date" formControlName="start_date" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-indigo-500">
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-2">Jours concernés</label>
      <div class="flex gap-2 justify-between">
        @for (day of weekDays; track day.value) {
          <button type="button"
                  (click)="toggleDay(day.value)"
                  [class.bg-indigo-600]="selectedDays.includes(day.value)"
                  [class.text-white]="selectedDays.includes(day.value)"
                  [class.bg-slate-100]="!selectedDays.includes(day.value)"
                  [class.text-slate-600]="!selectedDays.includes(day.value)"
                  class="w-10 h-10 rounded-full font-bold transition-colors">
            {{ day.label }}
          </button>
        }
      </div>
      @if (form.controls.days_of_week.touched && selectedDays.length === 0) {
        <p class="text-xs text-red-500 mt-1">Veuillez sélectionner au moins un jour.</p>
      }
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">De</label>
        <input type="time" formControlName="start_time" class="w-full border border-slate-300 rounded-lg p-2 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">À</label>
        <input type="time" formControlName="end_time" class="w-full border border-slate-300 rounded-lg p-2 focus:ring-indigo-500">
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Type de créneau</label>
      <select formControlName="slot_type" class="w-full border border-slate-300 rounded-lg p-2 focus:ring-indigo-500">
        <option value="work">Ouverture (Travail)</option>
        <option value="break">Pause (Break)</option>
      </select>
    </div>

    <div class="bg-indigo-50 p-3 rounded-lg border border-indigo-100 flex items-center justify-between">
      <label class="text-sm font-bold text-indigo-900">Appliquer sur (semaines)</label>
      <input type="number" formControlName="recurring_weeks" class="w-20 border border-slate-300 rounded-lg p-1.5 text-center">
    </div>

    <button type="submit" [disabled]="form.invalid || isLoading" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-bold hover:bg-indigo-700 disabled:opacity-50 transition-colors">
      @if (isLoading) { Création en cours... } @else { Ajouter au planning }
    </button>

    <div class="pt-2 border-t border-slate-100">
      <button type="button" (click)="markAbsence()" class="w-full text-red-600 hover:bg-bordeaux/5 py-2 rounded-lg text-sm font-medium transition-colors">
        Marquer absent à la date de début
      </button>
    </div>
  </form>
</div>
