<!-- Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm"
  (click)="onClose()">

  <!-- Carte modal -->
  <div class="bg-cream rounded-2xl shadow-lg w-full max-w-md p-6 space-y-6"
    (click)="$event.stopPropagation()">

    <!-- En-tête -->
    <div class="flex items-start justify-between">
      <div>
        <h2 class="text-lg font-bold text-gray-900">Réserver</h2>
        <p class="text-sm text-gray-500 mt-0.5">{{ service().name }}</p>
      </div>
      <button type="button" (click)="onClose()"
        class="text-gray-400 hover:text-gray-600 transition-colors p-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Récap service -->
    <div class="flex items-center justify-between bg-indigo-50 rounded-xl px-4 py-3 text-sm">
      <span class="text-indigo-700 font-medium">{{ service().defaultDuration }} min</span>
      <span class="text-indigo-700 font-bold">{{ service().basePrice }} €</span>
    </div>

    <!-- Erreur -->
    @if (errorMessage()) {
      <div role="alert" class="bg-bordeaux/10 text-bordeaux p-3 rounded-lg text-sm">
        {{ errorMessage() }}
      </div>
    }

    <!-- Formulaire -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4" novalidate>

      <div>
        <label for="bk-date" class="block text-sm font-medium text-gray-700 mb-1">
          Date <span class="text-red-500">*</span>
        </label>
        <input id="bk-date" type="date" formControlName="date"
          [min]="today"
          class="block w-full px-3 py-2 border border-beige rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all"/>
      </div>

      <div>
        <label for="bk-time" class="block text-sm font-medium text-gray-700 mb-1">
          Heure de début <span class="text-red-500">*</span>
        </label>
        <input id="bk-time" type="time" formControlName="start_time"
          class="block w-full px-3 py-2 border border-beige rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all"/>
      </div>

      <div class="flex gap-3 pt-2">
        <button type="button" (click)="onClose()"
          class="flex-1 py-2.5 border border-beige text-sm font-medium rounded-xl text-gray-700 hover:bg-cream transition-colors">
          Annuler
        </button>
        <button type="submit" [disabled]="isLoading()"
          class="flex-1 flex justify-center items-center gap-2 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-xl disabled:opacity-60 disabled:cursor-not-allowed transition-colors">
          @if (isLoading()) {
            <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
            </svg>
          }
          Confirmer
        </button>
      </div>

    </form>
  </div>
</div>
