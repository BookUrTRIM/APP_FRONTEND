<div class="space-y-4">

  <h2 class="font-display text-lg font-semibold text-gray-900">Où se situe le salon</h2>

  @if (provider()?.address) {
    <div class="bg-cream rounded-2xl border border-beige/40 shadow-sm p-6 space-y-3">
      <p class="text-sm text-gray-600 flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        {{ provider()!.address }}
      </p>
      <a [href]="mapUrl()" target="_blank" rel="noopener"
        class="inline-flex items-center gap-2 text-sm font-medium text-indigo-600 hover:text-indigo-700 transition-colors">
        Voir sur la carte
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
        </svg>
      </a>
    </div>
  } @else {
    <div class="bg-cream rounded-2xl border border-beige/40 p-8 text-center">
      <p class="text-gray-400 text-sm">Ce prestataire n'a pas renseigné d'adresse.</p>
    </div>
  }

</div>
