<div class="bg-cream rounded-2xl shadow-sm border card-lift border-beige/40 p-6 flex flex-col gap-4 card-lift cursor-pointer"
  [routerLink]="['/client/providers', provider().id]">

  <!-- Avatar + Nom -->
  <div class="flex items-center gap-4">
    <div class="h-14 w-14 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-700 text-xl font-bold shrink-0 border border-indigo-200">
      {{ getInitials(provider()) }}
    </div>
    <div>
      <h3 class="font-semibold text-gray-900 text-base">{{ getFullName(provider()) }}</h3>
      @if (provider().phone) {
        <p class="text-sm text-gray-400 flex items-center gap-1 mt-0.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.948V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
          </svg>
          {{ provider().phone }}
        </p>
      }
    </div>
  </div>

  <!-- CTA -->
  <button
    type="button"
    class="w-full mt-auto py-2 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium transition-colors"
    [routerLink]="['/client/providers', provider().id]"
  >
    Voir les prestations
  </button>

</div>
