<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 flex flex-col gap-3 hover:shadow-md transition-shadow">

  <div class="flex items-start justify-between gap-2">
    <h3 class="font-semibold text-gray-900 text-base leading-tight">{{ service().name }}</h3>
    <span class="shrink-0 text-lg font-bold text-indigo-600">{{ service().basePrice | number:'1.2-2' }} €</span>
  </div>

  @if (service().description) {
    <p class="text-sm text-gray-500 leading-relaxed">{{ service().description }}</p>
  }

  <div class="flex items-center gap-1.5 text-sm text-gray-400">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <span>{{ formatDuration(service().defaultDuration) }}</span>
  </div>

  <div class="flex gap-2 pt-1 border-t border-gray-100">
    <button
      type="button"
      (click)="onEdit.emit(service())"
      class="flex-1 flex items-center justify-center gap-1.5 py-1.5 text-sm text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors font-medium"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
      </svg>
      Modifier
    </button>
    <button
      type="button"
      (click)="onDelete.emit(service().id)"
      class="flex-1 flex items-center justify-center gap-1.5 py-1.5 text-sm text-red-500 hover:bg-red-50 rounded-lg transition-colors font-medium"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
      </svg>
      Supprimer
    </button>
  </div>

</div>
