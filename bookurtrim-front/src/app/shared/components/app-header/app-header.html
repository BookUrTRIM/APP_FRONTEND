@if (isClient()) {
  <app-client-header />
} @else {
  <header class="bg-espresso sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">

        <a routerLink="/" class="flex-shrink-0 flex items-center cursor-pointer">
          <span class="font-display text-2xl font-semibold text-cream tracking-wide italic">
            BookUr<span class="text-gold">TRIM</span>
          </span>
        </a>

        <div class="flex items-center gap-4">
          <a routerLink="/auth/login"
            class="text-sm font-semibold text-cream/70 hover:text-cream transition-colors">
            Se connecter
          </a>
          <a routerLink="/auth/signup"
            class="rounded-full bg-gold px-4 py-2 text-sm font-semibold text-espresso hover:bg-cream transition-colors">
            S'inscrire
          </a>
        </div>

      </div>
    </div>
  </header>
}
